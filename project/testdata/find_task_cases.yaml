general_rules:
- 测试用例接口传参中的${}为变量，需要根据general中的默认规则，如果默认规则没有，就是按照用例中操作步骤说明的规则进行变量替换
- fdName（任务名） = 用例ID _ 当前时间%YYYY-MM-DD HH:MM:SS。
- fdOriginalThirdId = 登录谷歌浏览器插件实际拿到的
- fdOriginalDeviceId = 登录谷歌浏览器插件实际拿到的
